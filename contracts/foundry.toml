[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["../node_modules"]
remappings = ["forge-std/=../node_modules/forge-std/src/", "@openzeppelin/=../node_modules/@openzeppelin/"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 500

[rpc_endpoints]
arc_testnet = "${ARC_RPC_URL}"
